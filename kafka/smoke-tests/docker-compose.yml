# Smoke test Docker Compose for Kafka 4.3.1
# Usage: docker compose up -d

services:
  kafka:
    image: ${KAFKA_IMAGE:-dawsonlp/kafka:4.3.1}
    pull_policy: ${PULL_POLICY:-always}  # Pull by default; set PULL_POLICY=never for local candidate tests
    container_name: kafka-smoke-test
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_INTERNAL_PORT:-29093}:29092"
    volumes:
      - kafka-smoke-data:/var/lib/kafka/data
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
    networks:
      - kafka-smoke-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  kafka-smoke-data:
    name: kafka-smoke-data

networks:
  kafka-smoke-network:
    name: kafka-smoke-network
