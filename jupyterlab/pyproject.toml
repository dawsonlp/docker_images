[project]
name = "jupyterlab-datascience-image"
version = "0.1.0"
description = "Batteries-included JupyterLab data science image dependencies"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bash-kernel>=0.10.0",
    "confluent-kafka>=2.15.0",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "jedi-language-server>=0.47.0",
    "jupyter-server-terminals>=0.5.4",
    "jupyterlab>=4.6.3",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-widgets>=3.0.17",
    "kafka-python-ng>=2.2.3",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "narwhals>=2.25.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.3.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
