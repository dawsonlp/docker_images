[project]
name = "jupyterlab-datascience-image"
version = "0.1.0"
description = "Batteries-included JupyterLab data science image dependencies"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bash-kernel>=0.10.0",
    "confluent-kafka>=2.14.0",
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
    "ipython>=9.14.0",
    "ipywidgets>=8.1.8",
    "jedi-language-server>=0.47.0",
    "jupyter-server-terminals>=0.5.4",
    "jupyterlab>=4.5.9",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-widgets>=3.0.16",
    "kafka-python-ng>=2.2.3",
    "langchain>=1.3.3",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "matplotlib>=3.10.9",
    "narwhals>=2.22.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg[binary,pool]>=3.3.4",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.50",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
